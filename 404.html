<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Devarsh Bagla</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0B0A09">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/sections.css">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("theme");
        var theme = (stored === "light" || stored === "dark")
          ? stored
          : (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
  <style>
    .missing {
      position: relative;
      isolation: isolate;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: var(--space-10) var(--gutter);
      text-align: center;
    }
    .missing__scope {
      position: absolute;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      opacity: 0.35;
      pointer-events: none;
    }
    .missing__copy {
      position: relative;
      z-index: 1;
    }
    .missing__code {
      margin: 0 0 var(--space-4);
      font-family: var(--font-mono);
      font-size: var(--step--1);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .missing__title {
      margin: 0 0 var(--space-4);
      font-family: var(--font-display);
      font-size: var(--step-4);
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--ink);
    }
    .missing__body {
      margin: 0 auto var(--space-7);
      max-width: 36ch;
      color: var(--ink-muted);
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main class="missing">
    <canvas class="missing__scope" data-missing-scope aria-hidden="true"></canvas>
    <div class="missing__copy">
      <p class="missing__code">404</p>
      <h1 class="missing__title">This page does not exist.</h1>
      <p class="missing__body">
        Most of my projects do not either, yet.
      </p>
      <a class="btn btn--primary" href="./">Back home</a>
    </div>
  </main>
  <script type="module" src="js/missing.js"></script>
</body>
</html>
